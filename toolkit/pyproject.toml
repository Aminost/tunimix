[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunimix"
version = "1.0.0"
description = "Any recipe (link, dish name, text, photo, PDF, video) -> Thermomix guided recipe -> Cookidoo. Tunisian cookbook included."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40", "cookidoo-api>=0.19", "aiohttp>=3.9", "recipe-scrapers>=15",
  "requests>=2.31", "beautifulsoup4>=4.12", "pydantic>=2.6", "reportlab>=4.0",
  "flask>=3.0", "python-telegram-bot>=21", "mcp>=1.2", "youtube-transcript-api>=1.0", "pillow>=10", "pypdf>=4", "pdfplumber>=0.11", "pypdfium2>=4", "python-docx>=1.1", "pytesseract>=0.3",
]

[project.optional-dependencies]
heic = ["pillow-heif"]
dev = ["pytest"]

[project.scripts]
tunimix = "tunimix.cli:main"

[tool.setuptools.packages.find]
include = ["tunimix*"]
